<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 16–32 px version of the icon: same black top flowing down in the middle, three thick bars,
       blue corner; a darker outline so the white part still reads on white backgrounds -->
  <defs>
    <clipPath id="tile"><rect x="24" y="24" width="976" height="976" rx="210"/></clipPath>
    <radialGradient id="blue" cx="1" cy="1" r="0.75">
      <stop offset="0" stop-color="#2f3cf0"/>
      <stop offset="0.5" stop-color="#7f8bff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="1024" height="1024" fill="#ffffff"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#blue)"/>
    <path fill="#000" d="M0 0 H1024 V470 C 900 470 860 500 800 580 C 740 660 650 730 512 730 C 374 730 284 660 224 580 C 164 500 124 470 0 470 Z"/>
  </g>
  <rect x="330" y="440" width="84" height="170" rx="42" fill="#fff"/>
  <rect x="470" y="370" width="84" height="290" rx="42" fill="#fff"/>
  <rect x="610" y="440" width="84" height="170" rx="42" fill="#fff"/>
  <rect x="36" y="36" width="952" height="952" rx="198" fill="none" stroke="#1e1e3c" stroke-opacity="0.35" stroke-width="24"/>
</svg>
