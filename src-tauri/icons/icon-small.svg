<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- ④ for 16–32 px: the same pill, bigger, with a thick curve and a big live dot -->
  <defs>
    <clipPath id="cap"><rect x="60" y="300" width="904" height="424" rx="212"/></clipPath>
    <linearGradient id="tileBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f3ff"/>
      <stop offset="1" stop-color="#c9d0ff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="992" height="992" rx="200" fill="url(#tileBg)"/>
  <rect x="60" y="300" width="904" height="424" rx="212" fill="#0b0c16"/>
  <g clip-path="url(#cap)">
    <path d="M60 640 C 180 630 220 520 330 530 C 440 540 470 640 560 610 C 650 580 660 440 760 440 L 964 440 V 760 H 60 Z" fill="url(#area)"/>
    <path d="M60 640 C 180 630 220 520 330 530 C 440 540 470 640 560 610 C 650 580 660 440 760 440" fill="none" stroke="url(#line)" stroke-width="64" stroke-linecap="round"/>
  </g>
  <circle cx="790" cy="440" r="78" fill="#34d399"/>
</svg>
