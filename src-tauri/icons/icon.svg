<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 4 网速曲线: the pill holds a live speed curve whose glow spills onto the frosted tile; the
       latest point is a bright dot — the island showing what the network is doing right now -->
  <defs>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="216"/></clipPath>
    <clipPath id="cap"><rect x="120" y="356" width="784" height="312" rx="156"/></clipPath>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.6  0 0 0 0.10 0"/>
    </filter>
    <linearGradient id="tileBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f6ff"/>
      <stop offset="1" stop-color="#e6e9fb"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#2a2a7a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#tileBg)"/>
    <!-- coloured light leaking out of the pill -->
    <ellipse cx="640" cy="620" rx="360" ry="200" fill="#4f6bff" opacity="0.55" filter="url(#blur)"/>
    <ellipse cx="300" cy="440" rx="260" ry="160" fill="#a78bfa" opacity="0.45" filter="url(#blur)"/>
    <rect x="0" y="0" width="1024" height="1024" filter="url(#grain)"/>
  </g>
  <rect x="120" y="356" width="784" height="312" rx="156" fill="#0b0c16" filter="url(#shadow)"/>
  <g clip-path="url(#cap)">
    <path d="M120 600 C 200 590 230 520 300 530 C 370 540 390 610 460 590 C 530 570 540 450 610 440 C 680 430 700 520 760 500 C 778 494 790 478 800 472 C 840 466 870 470 904 470 L 904 700 H 120 Z" fill="url(#area)"/>
    <path d="M120 600 C 200 590 230 520 300 530 C 370 540 390 610 460 590 C 530 570 540 450 610 440 C 680 430 700 520 760 500 C 778 494 790 478 800 472" fill="none" stroke="url(#line)" stroke-width="22" stroke-linecap="round"/>
  </g>
  <circle cx="800" cy="472" r="32" fill="#34d399"/>
  <circle cx="800" cy="472" r="56" fill="#34d399" fill-opacity="0.25"/>
  <rect x="122" y="358" width="780" height="308" rx="154" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>
  <rect x="66" y="66" width="892" height="892" rx="214" fill="none" stroke="#1e1b4b" stroke-opacity="0.08" stroke-width="4"/>
</svg>
