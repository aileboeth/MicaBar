<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MicaBar</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="motion.css" />
  <link rel="stylesheet" href="live.css" />
</head>
<body data-mode="manager">
  <div id="island" class="expanded">
    <canvas id="glass" hidden></canvas>
    <div id="pill" hidden></div>
    <aside id="side">
      <div class="brand"><img src="icon.png" alt=""><span>MicaBar</span></div>
      <nav class="tabs" id="tabs"></nav>
      <div class="side-foot"><button class="ghost" data-do="layout-edit">调整岛的大小</button></div>
    </aside>
    <main id="panel">
      <header id="toolbar">
        <div id="proxy-line"></div>
        <span id="search-wrap"><input id="search" type="text" placeholder="搜索 程序 / 域名 / IP / 端口" spellcheck="false" /><button id="search-x" type="button" data-do="search-clear" hidden title="清空" aria-label="清空">✕</button></span>
        <div id="total-speed" class="mono"></div>
        <button id="gear" hidden></button>
      </header>
      <div id="exit-row" hidden></div>
      <div id="list"></div>
      <div id="foot"></div>
      <div id="menu" hidden></div>
      <div id="toast"></div>
    </main>
  </div>
  <div id="edit" hidden></div>
  <script src="i18n.js"></script>
  <script src="charts.js"></script>
  <script src="motion.js"></script>
  <script src="app.js"></script>
</body>
</html>
